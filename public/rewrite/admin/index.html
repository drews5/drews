<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Website editor | The Re-Write It Project</title><link rel="stylesheet" href="/rewrite/admin/editor.css?v=suggest2"><script type="module" src="/rewrite/admin/editor.js?v=suggest2"></script></head><body>
<header><a href="/rewrite/">The Re-Write It Project</a><span>Website editor</span><button id="logout" hidden>Sign out</button></header>
<div id="suggestion-banner" class="suggestion-banner" hidden><p>Want more detailed edits?</p><button id="suggest-open" type="button" aria-haspopup="dialog" aria-controls="suggestion-dialog">Suggest</button></div>
<main id="login"><div class="login-card"><h1>Website editor</h1><form id="login-form"><label>Password<input type="password" autocomplete="current-password" id="password" required></label><button class="primary">Sign in</button></form><p id="login-status" role="status"></p></div></main>
<main id="dashboard" hidden><div class="dashboard-heading"><div><h1>Your pages</h1></div><button id="publish" class="primary">Publish</button></div><p id="status" role="status"></p><details id="shared-settings"><summary>Shared site settings</summary><div id="shared-fields"></div><button id="save-settings">Save</button></details><div id="pages" class="page-grid"></div></main>
<section id="editor" hidden aria-label="Page editor"><div class="toolbar"><button id="back">All pages</button><strong id="page-name"></strong><div class="tools"><button id="content-view" aria-pressed="false">Content</button><button id="preview-view" aria-pressed="true">Preview</button><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Save</button><button id="publish-page" class="primary">Publish</button></div><span id="edit-status" role="status"></span></div><div class="workspace"><div id="content-list" hidden><label>Find content<input id="content-search" type="search" placeholder="Search text or images"></label><div id="content-items"></div></div><div id="canvas"><iframe id="preview" sandbox="allow-same-origin" title="Editable page preview"></iframe></div><aside id="inspector"><button id="close-inspector" type="button">Done</button><h2 id="selection-heading">Select an item</h2><p id="selection-help">Tap text or an image to edit.</p><div id="fields" hidden><label id="text-wrap">Text<textarea id="text" rows="6"></textarea></label><label id="href-wrap">Link URL<input id="href" type="url"></label><div id="image-wrap"><label>Image description<input id="alt"></label><label class="upload-label">Replace image<input type="file" id="replace" accept="image/*"></label></div><label class="upload-label">Add image after selection<input type="file" id="add" accept="image/*"></label><button id="revert">Revert this element</button><button id="remove-image" hidden>Remove image</button></div></aside></div></section>

<dialog id="suggestion-dialog" aria-labelledby="suggestion-title">
 <div class="suggestion-dialog-header"><div><h2 id="suggestion-title">Suggest an edit</h2><p>To Drew Scheid · drewscheid05@gmail.com</p></div><button id="suggest-close" type="button" aria-label="Close edit request">×</button></div>
 <form id="suggestion-form" action="https://formsubmit.co/drewscheid05@gmail.com" method="post">
  <div id="suggestion-fields">
   <div class="suggestion-row"><label>Your name<input id="suggest-name" name="name" autocomplete="name" required maxlength="120"></label><label>Your email<input id="suggest-email" name="email" type="email" autocomplete="email" required maxlength="200"></label></div>
   <label>Page<select id="suggest-page" name="page"><option value="site-wide">Whole website</option></select></label>
   <label>What would you like changed?<textarea id="suggest-message" name="message" required maxlength="10000" rows="5" placeholder="Describe the change. You can paste new wording or links here."></textarea></label>
   <label>Screenshot or image <span class="optional">(optional)</span><input id="suggest-images" type="file" accept="image/*" multiple aria-describedby="suggest-image-help suggest-file-status"></label><p id="suggest-image-help" class="field-help">Up to 3 images, 20 MB each.</p><p id="suggest-file-status" class="field-help" role="status"></p>
   <label class="suggestion-honey" aria-hidden="true">Leave this empty<input name="_honey" tabindex="-1" autocomplete="off"></label>
   <p id="suggestion-status" role="status" tabindex="-1"></p><div class="suggestion-actions"><button id="suggest-send" type="submit" class="primary">Send to Drew</button></div>
  </div>
  <div id="suggestion-success" hidden><h3 id="suggest-success-heading" tabindex="-1">Sent to Drew</h3><button id="suggest-another" type="button">Send another</button></div>
 </form>
</dialog>
</body></html>
