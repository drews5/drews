<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Website editor | The Re-Write It Project</title><link rel="stylesheet" href="/rewrite/admin/editor.css?v=shared1"><script type="module" src="/rewrite/admin/editor.js?v=shared1"></script></head><body>
<header><a href="/rewrite/">The Re-Write It Project</a><span>Website editor</span><button id="logout" hidden>Sign out</button></header>
<main id="login"><div class="login-card"><h1>Website editor</h1><form id="login-form"><label>Password<input type="password" autocomplete="current-password" id="password" required></label><button class="primary">Sign in</button></form><p id="login-status" role="status"></p></div></main>
<main id="dashboard" hidden><div class="dashboard-heading"><div><h1>Your pages</h1></div><button id="publish" class="primary">Publish</button></div><p id="status" role="status"></p><details id="shared-settings"><summary>Shared site settings</summary><p>Changes apply across all Re-Write It pages. Use spreadsheet restores the spreadsheet value.</p><div id="shared-fields"></div><button id="save-settings">Save</button></details><div id="pages" class="page-grid"></div></main>
<section id="editor" hidden aria-label="Page editor"><div class="toolbar"><button id="back">All pages</button><strong id="page-name"></strong><div class="tools"><button id="content-view" aria-pressed="false">Content</button><button id="preview-view" aria-pressed="true">Preview</button><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Save</button><button id="publish-page" class="primary">Publish</button></div><span id="edit-status" role="status"></span></div><div class="workspace"><div id="content-list" hidden><label>Find content<input id="content-search" type="search" placeholder="Search text or images"></label><div id="content-items"></div></div><div id="canvas"><iframe id="preview" sandbox="allow-same-origin" title="Editable page preview"></iframe></div><aside id="inspector"><button id="close-inspector" type="button">Done</button><h2 id="selection-heading">Select an item</h2><p id="selection-help">Tap text or an image to edit.</p><div id="fields" hidden><label id="text-wrap">Text<textarea id="text" rows="6"></textarea></label><label id="href-wrap">Link URL<input id="href" type="url"></label><div id="image-wrap"><label>Image description<input id="alt"></label><label class="upload-label">Replace image<input type="file" id="replace" accept="image/*"></label></div><label class="upload-label">Add image after selection<input type="file" id="add" accept="image/*"></label><button id="revert">Revert this element</button><button id="remove-image" hidden>Remove image</button></div></aside></div></section>
</body></html>
